name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The sqlx query macros check against the committed cache in .sqlx/, no
  # database at build time.
  SQLX_OFFLINE: "true"

jobs:
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same rule as .githooks/commit-msg: no AI attribution lines.
      - run: |
          if git log --format=%B "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" \
            | grep -iE '^(co-authored-by:.*(anthropic|claude)|claude-session:)|generated with \[claude code\]|claude\.ai/code/session_'; then
            echo "::error::Remove the attribution lines above from the commit messages."
            exit 1
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passbox
          POSTGRES_PASSWORD: passbox
          POSTGRES_DB: passbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U passbox -d passbox_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A superuser (the image's POSTGRES_USER): every test run creates and
      # drops a database of its own with the production roles.
      PASSBOX_TEST_DATABASE_URL: postgres://passbox:passbox@localhost:5432/passbox_test
      # The sqlx query macros check against the committed cache in .sqlx/.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
