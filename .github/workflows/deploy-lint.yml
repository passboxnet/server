# Lints the deployment code: Terraform (fmt, validate, tflint, offline
# tests with mocked providers), Ansible (ansible-lint, production profile),
# Dockerfiles (hadolint) and shell scripts (shellcheck). Never talks to the
# Hetzner API.
#
# Repository split: this workflow moves to the PRIVATE infrastructure
# repository together with deploy/hetzner and deploy/website. The public
# server repository keeps only the hadolint/shellcheck part for the root
# Dockerfile and deploy/compose (job "containers").
name: Deploy lint

on:
  pull_request:
    paths:
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-lint.yml"
      - ".github/workflows/images.yml"
  push:
    branches: [master]
    paths:
      - "deploy/**"
      - "Dockerfile"
      - ".github/workflows/deploy-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.13.4
  TFLINT_VERSION: v0.59.1
  ANSIBLE_CORE_VERSION: 2.19.3
  ANSIBLE_LINT_VERSION: 25.9.2
  HADOLINT_VERSION: v2.14.0
  SHELLCHECK_VERSION: v0.11.0

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff deploy/hetzner/terraform
      - name: terraform validate (both environments, no backend)
        run: |
          for env in staging production; do
            terraform -chdir="deploy/hetzner/terraform/envs/$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="deploy/hetzner/terraform/envs/$env" validate
          done
      - name: terraform test (mocked providers)
        run: |
          terraform -chdir=deploy/hetzner/terraform/modules/platform init -input=false
          terraform -chdir=deploy/hetzner/terraform/modules/platform test
      - name: tflint
        working-directory: deploy/hetzner/terraform
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl"

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core and ansible-lint
        run: pip install "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
      - name: Install collections
        working-directory: deploy/hetzner/ansible
        run: ansible-galaxy collection install -r requirements.yml -p .ansible/collections
      - name: ansible-lint (production profile)
        working-directory: deploy/hetzner/ansible
        run: ansible-lint --offline
      - name: Syntax check of every playbook
        working-directory: deploy/hetzner/ansible
        run: |
          for playbook in site.yml rollout-app.yml rollout-website.yml backup-check.yml restore-test.yml restore-drill.yml; do
            ansible-playbook --syntax-check -i localhost, "$playbook"
          done

  containers:
    name: Dockerfiles and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint and shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          chmod +x "$RUNNER_TEMP/bin/"*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: hadolint
        run: hadolint Dockerfile deploy/website/Dockerfile deploy/compose/backup/Dockerfile
      - name: shellcheck
        run: |
          find deploy -name '*.sh' -print0 | xargs -0 shellcheck
      - name: docker compose config
        working-directory: deploy/compose
        run: |
          sed 's/=$/=ci-placeholder/' .env.example > .env
          docker compose config --quiet
