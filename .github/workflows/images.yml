# Builds, scans, signs and publishes the container images to GHCR.
#
# Runs only on version tags (v*) and on manual dispatch, to keep Actions
# minutes low. Each image is built for linux/amd64 and linux/arm64 (Hetzner
# CAX), pushed by digest, scanned with Trivy, and only then tagged and signed
# with cosign (keyless, GitHub OIDC). Buildx attaches an SPDX SBOM and SLSA
# provenance (mode=max) to every image.
#
# Verify a published image:
#   cosign verify ghcr.io/<owner>/passbox-server@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/images\.yml@refs/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
#
# Actions are pinned to commit SHAs (tag in the comment); let Dependabot or
# Renovate update them.
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        options: [server]
        default: server
      push:
        description: Push, sign and tag (off = build and scan only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing, provenance
      security-events: write # Trivy SARIF upload
      actions: read # the SARIF upload reads the run in private repositories
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: passbox-server
            dockerfile: Dockerfile
            title: Passbox server
    env:
      SELECTED: ${{ github.event_name == 'push' && 'both' || inputs.image }}
      PUSH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - name: Skip images that were not selected
        id: gate
        run: |
          if [ "$SELECTED" = both ] || [ "$SELECTED" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        name: Image name
        id: name
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.gate.outputs.run == 'true' && env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.gate.outputs.run == 'true'
        name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}

      # Build both architectures and push by digest only. No tag points at
      # the image until the scan below has passed.
      - if: steps.gate.outputs.run == 'true'
        name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.name.outputs.created }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.ref) || 'type=cacheonly' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Without push, build the amd64 image into the local daemon to scan it.
      - if: steps.gate.outputs.run == 'true' && env.PUSH != 'true'
        name: Load amd64 image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.name.outputs.ref }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}

      - if: steps.gate.outputs.run == 'true'
        name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.PUSH == 'true' && format('{0}@{1}', steps.name.outputs.ref, steps.build.outputs.digest) || format('{0}:scan', steps.name.outputs.ref) }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Code scanning needs GitHub Advanced Security in a private repository,
      # so the upload may fail there; the gate below still blocks the release.
      - if: steps.gate.outputs.run == 'true' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}

      # Fail on fixable critical vulnerabilities (the SARIF step above still
      # reports HIGH ones in code scanning).
      - if: steps.gate.outputs.run == 'true'
        name: Gate on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: ${{ env.PUSH == 'true' && format('{0}@{1}', steps.name.outputs.ref, steps.build.outputs.digest) || format('{0}:scan', steps.name.outputs.ref) }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: steps.gate.outputs.run == 'true' && env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - if: steps.gate.outputs.run == 'true' && env.PUSH == 'true'
        name: Sign and tag
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          cosign sign --yes "${REF}@${DIGEST}"
          args=""
          for tag in $TAGS; do args="$args --tag $tag"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $args "${REF}@${DIGEST}"
          {
            echo "### ${{ matrix.title }}"
            echo
            echo "\`${REF}@${DIGEST}\`"
            echo
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
