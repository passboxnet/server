[package]
name = "passbox-server"
description = "The Passbox headless server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "passbox-server"
path = "src/main.rs"

[dependencies]
passbox-core = { workspace = true, features = ["oidc"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
data-encoding.workspace = true
hmac.workspace = true
lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "io-util", "fs"] }
# Streaming attachment blobs from and to disk.
tokio-util = { version = "0.7", features = ["io"] }
http-body-util = "0.1"
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# HTTP for website icons and webhook delivery (D5).
ureq.workspace = true
url = "2"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
passbox-core = { workspace = true, features = ["oidc", "test-issuer"] }

[lints]
workspace = true
