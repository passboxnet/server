# Minimal self-hosted setup. Put a reverse proxy with HTTPS in front of it
# before storing real data.
services:
  passbox:
    build:
      context: ..
    image: passbox:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      # Uncomment to use PostgreSQL instead of the bundled SQLite database:
      # PASSBOX_DATABASE_URL: postgres://passbox:passbox@postgres/passbox
      # Address users open Passbox at; used for links in mails.
      # PASSBOX_PUBLIC_URL: https://passbox.example.com
      # Outgoing mail (invitations, new-device notices). Without it, mails are logged.
      # PASSBOX_SMTP_URL: smtps://user:password@smtp.example.com:465
      # PASSBOX_MAIL_FROM: Passbox <passbox@example.com>
      # The first account becomes instance admin; these emails always are.
      # PASSBOX_ADMIN_EMAILS: admin@example.com
    volumes:
      - passbox-data:/data

volumes:
  passbox-data:
