openapi: 3.1.0
info:
  title: Passbox API
  version: 0.2.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API of the Passbox server. All vault data is encrypted on the client;
    the server only stores and relays ciphertext. Binary values are unpadded
    Base64url strings. Timestamps are Unix milliseconds.

    Errors have the shape `{ "error": "<code>", "message": "...", "details"?: {...} }`
    with the codes `bad_request`, `unauthorized`, `invalid_credentials`,
    `not_found`, `conflict`, `rate_limited` and `internal`, and with status 403
    `forbidden` (not an instance admin), `account_disabled`,
    `registration_closed`, `domain_not_allowed` and `invitation_invalid`.
    Two-factor errors: `reauthentication_required` (403),
    `invalid_two_factor_code` and `two_factor_expired` (401).

    Two-factor authentication: when an account has a second factor (TOTP
    authenticator app or WebAuthn security key), `login/finish` answers with
    a `TwoFactorChallenge` instead of a session, unless the device token sent
    to `login/start` belongs to a device remembered within the last 30 days.
    `login/two-factor` completes the login. The challenge only appears after
    the password was verified, so unknown accounts stay indistinguishable.
servers:
  - url: http://localhost:8080
security:
  - session: []
paths:
  /health:
    get:
      summary: Liveness check
      operationId: health
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/meta:
    get:
      summary: Public server information
      operationId: meta
      security: []
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerMeta" }
  /api/v1/auth/prelogin:
    post:
      summary: Key derivation parameters for an email
      description: Unknown emails receive stable fake values, so the response does not reveal whether an account exists.
      operationId: prelogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: Parameters.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, kdfSalt, kdfParams]
                properties:
                  accountId: { $ref: "#/components/schemas/Id" }
                  kdfSalt: { $ref: "#/components/schemas/Base64Url" }
                  kdfParams: { $ref: "#/components/schemas/KdfParams" }
  /api/v1/auth/register/start:
    post:
      summary: Start an OPAQUE registration
      operationId: registerStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, email, registrationRequest]
              properties:
                accountId: { $ref: "#/components/schemas/Id" }
                email: { type: string }
                registrationRequest: { $ref: "#/components/schemas/Base64Url" }
                inviteToken:
                  type: string
                  description: Token from an invitation link. Needed when the registration mode is not `open` (in `domains` mode for other domains).
      responses:
        "200":
          description: OPAQUE registration response.
          content:
            application/json:
              schema:
                type: object
                required: [registrationResponse]
                properties:
                  registrationResponse: { $ref: "#/components/schemas/Base64Url" }
        "403": { $ref: "#/components/responses/RegistrationRefused" }
        "409":
          description: The email or account ID is taken.
  /api/v1/auth/register/finish:
    post:
      summary: Finish the registration and create the account with its first vault
      operationId: registerFinish
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, email, registrationUpload, kdfSalt, kdfParams, encryptedAccountKey, vault]
              properties:
                accountId: { $ref: "#/components/schemas/Id" }
                email: { type: string }
                registrationUpload: { $ref: "#/components/schemas/Base64Url" }
                kdfSalt: { $ref: "#/components/schemas/Base64Url" }
                kdfParams: { $ref: "#/components/schemas/KdfParams" }
                encryptedAccountKey: { $ref: "#/components/schemas/Base64Url" }
                vault: { $ref: "#/components/schemas/NewVault" }
                inviteToken: { type: string }
                locale:
                  type: string
                  enum: [en, de]
                  description: Language of mails to the account; defaults to `Accept-Language`.
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { $ref: "#/components/schemas/Id" }
        "403": { $ref: "#/components/responses/RegistrationRefused" }
        "409":
          description: The email or account ID is taken.
  /api/v1/auth/login/start:
    post:
      summary: Start an OPAQUE login
      operationId: loginStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, credentialRequest]
              properties:
                email: { type: string }
                credentialRequest: { $ref: "#/components/schemas/Base64Url" }
                deviceToken:
                  type: string
                  description: |
                    The `deviceToken` from this device's last successful login.
                    A valid token for this account exempts the login from the
                    per-email lockout (it still counts against the per-IP limit
                    and the token's own limit of 10 failures per 15 minutes).
                    Invalid or foreign tokens are ignored.
      responses:
        "200":
          description: OPAQUE credential response. Finish within 5 minutes.
          content:
            application/json:
              schema:
                type: object
                required: [loginId, credentialResponse]
                properties:
                  loginId: { $ref: "#/components/schemas/Id" }
                  credentialResponse: { $ref: "#/components/schemas/Base64Url" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login/finish:
    post:
      summary: Finish the login and receive a session token
      operationId: loginFinish
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, credentialFinalization]
              properties:
                loginId: { $ref: "#/components/schemas/Id" }
                credentialFinalization: { $ref: "#/components/schemas/Base64Url" }
                deviceName: { type: string, description: 'Shown in the device list, for example "Chrome on macOS".' }
                clientKind: { type: string, enum: [web, extension, desktop, ios, android, cli] }
                origin:
                  type: string
                  description: |
                    The web client's `location.origin`. Selects the security
                    keys offered in `TwoFactorChallenge.webauthn`.
      responses:
        "200":
          description: |
            A session, or a second-factor challenge when two-factor
            authentication is on and the device is not remembered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/TwoFactorChallenge"
        "401":
          description: Wrong credentials, unknown or expired login.
        "403":
          description: "`account_disabled`: the password was right, but an instance admin disabled the account."
  /api/v1/auth/login/two-factor:
    post:
      summary: Complete a login with its second factor
      description: |
        Wrong factors count against the account (10) and the client IP (100)
        per 15 minutes; a challenge allows 5 attempts. A TOTP code is
        accepted once (±1 time step of 30 seconds); a recovery code is
        deleted when used.
      operationId: loginTwoFactor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SecondFactor"
                - type: object
                  required: [challengeToken]
                  properties:
                    challengeToken: { type: string }
                    rememberDevice:
                      type: boolean
                      description: |
                        Skip the second step on this device for 30 days. Bound
                        to the device token issued with this session (it
                        carries over when the token is rotated).
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: Unknown method. }
        "401":
          description: |
            `invalid_two_factor_code` (try again) or `two_factor_expired`
            (unknown, used or expired challenge; sign in again).
        "403": { description: "`account_disabled`" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/account:
    get:
      summary: The signed-in account
      operationId: account
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema:
                type: object
                required: [accountId, email, kdfSalt, kdfParams, encryptedAccountKey]
                properties:
                  accountId: { $ref: "#/components/schemas/Id" }
                  email: { type: string }
                  kdfSalt: { $ref: "#/components/schemas/Base64Url" }
                  kdfParams: { $ref: "#/components/schemas/KdfParams" }
                  encryptedAccountKey: { $ref: "#/components/schemas/Base64Url" }
                  instanceAdmin: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/account/preferences:
    get:
      summary: Mail language and notification settings
      operationId: preferences
      responses:
        "200":
          description: Preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Change preferences (omitted fields stay)
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, enum: [en, de, ""], description: '`""` resets to the instance default.' }
                notifyNewDevice: { type: boolean }
      responses:
        "200":
          description: The stored preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPreferences" }
        "400": { description: Unknown locale. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/settings:
    get:
      summary: Instance settings and mail status
      operationId: adminSettings
      tags: [admin]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Change the instance settings
      operationId: updateAdminSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceSettings" }
      responses:
        "200":
          description: The stored settings. Changes are recorded in the admin log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "400": { description: Invalid settings. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users:
    get:
      summary: Accounts on the server
      operationId: adminUsers
      tags: [admin]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Part of the email. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Newest accounts first.
          content:
            application/json:
              schema:
                type: object
                required: [users, total]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{id}/disable:
    post:
      summary: Disable an account
      description: Deletes all its sessions at once; logins then fail with `account_disabled`. Data stays. Admins cannot disable themselves.
      operationId: disableUser
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Disabled (or already disabled). }
        "400": { description: The admin's own account. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown account. }
  /api/v1/admin/users/{id}/enable:
    post:
      summary: Enable a disabled account
      operationId: enableUser
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Enabled. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown account. }
  /api/v1/admin/mail/test:
    post:
      summary: Queue a test mail
      operationId: sendTestMail
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, description: Defaults to the admin's own email. }
      responses:
        "200":
          description: Queued. Without SMTP it is written to the server log.
          content:
            application/json:
              schema:
                type: object
                required: [id, to, mailConfigured]
                properties:
                  id: { type: string }
                  to: { type: string }
                  mailConfigured: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/invites:
    get:
      summary: Invitations, newest first
      operationId: adminInvites
      tags: [admin]
      responses:
        "200":
          description: Invitations.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invite" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Invite an email to create an account
      description: |
        Mails a link `<base>/#/?invite=<token>&email=<email>` that is valid for 7 days and
        replaces earlier unused invitations for the email. The base is
        `PASSBOX_PUBLIC_URL`, else `linkBase`.
      operationId: createInvite
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                locale: { type: string, enum: [en, de] }
                linkBase:
                  { type: string, description: "Origin of the web app, for example `https://vault.example.com`." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Invite" }
                  - type: object
                    required: [link, mailConfigured]
                    properties:
                      link: { type: [string, "null"] }
                      mailConfigured: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: An account with this email exists. }
  /api/v1/admin/invites/{id}:
    delete:
      summary: Withdraw an unused invitation
      operationId: revokeInvite
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Withdrawn. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown or already used. }
  /api/v1/admin/events:
    get:
      summary: Admin audit log, newest first
      description: |
        Rows are hash-chained: `hash` is the SHA-256 (hex) of the JSON array
        `[prevHash, seq, id, actorId, actorEmail, action, target, details, ip, createdAt]`
        (with `details` as the stored JSON text), and `prevHash` is the previous
        row's hash (`""` for the first). `chain` reports the check of the whole log.
      operationId: adminEvents
      tags: [admin]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: before, in: query, schema: { type: integer }, description: Only events with a lower `seq`. }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [events, chain]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/AdminEvent" } }
                  chain:
                    type: object
                    required: [valid, length, brokenAt]
                    properties:
                      valid: { type: boolean }
                      length: { type: integer }
                      brokenAt: { type: [integer, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/account/two-factor:
    get:
      summary: Two-factor authentication status
      operationId: twoFactorStatus
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, totp, securityKeys, recoveryCodesRemaining]
                properties:
                  enabled: { type: boolean }
                  totp: { type: boolean }
                  securityKeys:
                    type: array
                    items:
                      type: object
                      required: [id, name, createdAt, lastUsedAt]
                      properties:
                        id: { $ref: "#/components/schemas/Id" }
                        name: { type: string }
                        createdAt: { type: integer }
                        lastUsedAt: { type: integer, description: 0 if never used. }
                  recoveryCodesRemaining: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/account/two-factor/totp/start:
    post:
      summary: Create a TOTP secret for an authenticator app
      description: |
        Needs a session from a login in the last 10 minutes
        (`reauthentication_required` otherwise). The secret stays pending
        until `totp/confirm`; it is stored encrypted with the server's
        two-factor key.
      operationId: twoFactorTotpStart
      responses:
        "200":
          description: The secret (Base32) and an `otpauth://` URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret: { type: string }
                  uri: { type: string }
        "403": { description: "`reauthentication_required`" }
        "409": { description: An authenticator app is already set up. }
  /api/v1/account/two-factor/totp/confirm:
    post:
      summary: Turn the pending TOTP on with a first code
      operationId: twoFactorTotpConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Enabled. `recoveryCodes` (shown once) when the account had none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { description: No pending secret. }
        "401": { description: "`invalid_two_factor_code`" }
        "403": { description: "`reauthentication_required`" }
  /api/v1/account/two-factor/totp:
    delete:
      summary: Remove the authenticator app
      description: Refused with 409 when it is the last second factor; use `disable`.
      operationId: twoFactorTotpRemove
      responses:
        "204": { description: Removed. }
        "403": { description: "`reauthentication_required`" }
        "404": { description: No authenticator app. }
        "409": { description: Last second factor. }
  /api/v1/account/two-factor/webauthn/register/start:
    post:
      summary: Start registering a security key or passkey
      description: |
        The RP ID is the host of `origin`, which must be https (or http on
        localhost). Needs a recent login.
      operationId: twoFactorWebauthnRegisterStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin: { type: string, description: The page's `location.origin`. }
      responses:
        "200":
          description: Options for `navigator.credentials.create` (binary values Base64url).
          content:
            application/json:
              schema:
                type: object
                required: [registrationId, publicKey]
                properties:
                  registrationId: { type: string }
                  publicKey: { type: object, description: PublicKeyCredentialCreationOptions. }
        "400": { description: Origin not usable for WebAuthn. }
        "403": { description: "`reauthentication_required`" }
  /api/v1/account/two-factor/webauthn/register/finish:
    post:
      summary: Store a verified security key
      description: |
        Checks type, challenge, origin, RP ID hash, user presence and the
        ES256 or Ed25519 public key. Attestation statements are not verified.
      operationId: twoFactorWebauthnRegisterFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId, credential]
              properties:
                registrationId: { type: string }
                name: { type: string }
                credential:
                  type: object
                  required: [clientDataJson, attestationObject]
                  properties:
                    clientDataJson: { $ref: "#/components/schemas/Base64Url" }
                    attestationObject: { $ref: "#/components/schemas/Base64Url" }
      responses:
        "201":
          description: Stored. `recoveryCodes` (shown once) when the account had none.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RecoveryCodes"
                  - type: object
                    required: [id]
                    properties:
                      id: { $ref: "#/components/schemas/Id" }
        "400": { description: Verification failed. }
        "401": { description: "`two_factor_expired`: unknown or used registration." }
        "409": { description: Key already registered. }
  /api/v1/account/two-factor/webauthn/{id}:
    delete:
      summary: Remove a security key
      description: Refused with 409 when it is the last second factor; use `disable`.
      operationId: twoFactorWebauthnRemove
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "204": { description: Removed. }
        "403": { description: "`reauthentication_required`" }
        "404": { description: Unknown key. }
        "409": { description: Last second factor. }
  /api/v1/account/two-factor/recovery-codes:
    post:
      summary: Replace the recovery codes
      description: Needs a recent login and two-factor authentication on.
      operationId: twoFactorRecoveryCodes
      responses:
        "200":
          description: Ten new codes, shown once. The old ones stop working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "403": { description: "`reauthentication_required`" }
  /api/v1/account/two-factor/challenge:
    post:
      summary: Start checking a second factor while signed in
      description: Needed to turn two-factor authentication off with a security key.
      operationId: twoFactorChallenge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                origin: { type: string }
      responses:
        "200":
          description: A challenge (same shape as at login, without `twoFactorRequired`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorChallenge" }
  /api/v1/account/two-factor/disable:
    post:
      summary: Turn two-factor authentication off
      description: |
        Needs a valid second factor or recovery code. Removes the
        authenticator app, all security keys and recovery codes, and forgets
        remembered devices.
      operationId: twoFactorDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SecondFactor"
                - type: object
                  properties:
                    challengeToken: { type: string, description: From `two-factor/challenge`; required for `webauthn`. }
      responses:
        "204": { description: Turned off. }
        "401": { description: "`invalid_two_factor_code`" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/sync:
    get:
      summary: Changes since a cursor
      operationId: sync
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Vaults and items changed after `since`, and the new cursor.
          content:
            application/json:
              schema:
                type: object
                required: [cursor, vaults, items]
                properties:
                  cursor: { type: integer }
                  vaults:
                    type: array
                    items: { $ref: "#/components/schemas/SyncVault" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SyncItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vaults:
    post:
      summary: Create a vault
      operationId: createVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewVault" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResponse" }
        "409": { description: The vault ID exists. }
  /api/v1/vaults/{id}:
    put:
      summary: Update vault metadata
      operationId: updateVault
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, encryptedMeta]
              properties:
                revision: { type: integer, description: Stored revision + 1 }
                encryptedMeta: { $ref: "#/components/schemas/Base64Url" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResponse" }
        "404": { description: Unknown vault. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/items/{id}:
    put:
      summary: Create (revision 1) or update an item
      operationId: putItem
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaultId, revision, encryptedData]
              properties:
                vaultId: { $ref: "#/components/schemas/Id" }
                revision: { type: integer, description: 1 for new items, otherwise stored revision + 1 }
                encryptedData: { $ref: "#/components/schemas/Base64Url" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResponse" }
        "404": { description: Unknown vault or item. }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Delete an item (keeps a tombstone)
      operationId: deleteItem
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: revision, in: query, required: true, schema: { type: integer }, description: Stored revision + 1 }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResponse" }
        "404": { description: Unknown item. }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing, invalid or expired session token.
    RateLimited:
      description: |
        Too many requests or failed logins. `details.retryAfterSeconds` and the
        `Retry-After` header give the remaining time of the current window.
    Conflict:
      description: The revision does not follow the stored one. `details.currentRevision` holds the stored revision.
    Forbidden:
      description: "`forbidden`: the account is not an instance admin."
    RegistrationRefused:
      description: |
        `registration_closed` (invite-only server), `domain_not_allowed`
        (`domains` mode, other domain) or `invitation_invalid`.
  schemas:
    Session:
      type: object
      required: [token, accountId, sessionId, expiresAt, deviceToken]
      properties:
        token: { type: string }
        accountId: { $ref: "#/components/schemas/Id" }
        sessionId: { $ref: "#/components/schemas/Id" }
        expiresAt: { type: integer }
        deviceToken:
          type: string
          description: |
            Store it on the device and send it with the next
            `login/start`. Every successful login issues a new token
            and invalidates the one it was started with. Tokens grant
            no access by themselves, survive logout and session
            revocation, expire after a year, and are invalidated for
            all other devices by a master password change.
        recoveryCodesRemaining:
          type: integer
          description: Present after signing in with a recovery code.
    TwoFactorChallenge:
      type: object
      required: [twoFactorRequired, challengeToken, expiresAt, methods]
      properties:
        twoFactorRequired: { type: boolean, const: true }
        challengeToken: { type: string, description: Valid for 5 minutes. }
        expiresAt: { type: integer }
        methods:
          type: array
          items: { type: string, enum: [totp, webauthn, recovery] }
        webauthn:
          type: object
          description: |
            PublicKeyCredentialRequestOptions for `navigator.credentials.get`
            (binary values Base64url), present when the account has security
            keys.
          required: [challenge, rpId, allowCredentials, timeout, userVerification]
          properties:
            challenge: { $ref: "#/components/schemas/Base64Url" }
            rpId: { type: string }
            allowCredentials:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, const: public-key }
                  id: { $ref: "#/components/schemas/Base64Url" }
            timeout: { type: integer }
            userVerification: { type: string }
    SecondFactor:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [totp, recovery, webauthn] }
        code: { type: string, description: 6-digit code or recovery code (case, spaces and dashes ignored). }
        webauthn:
          type: object
          required: [credentialId, clientDataJson, authenticatorData, signature]
          properties:
            credentialId: { $ref: "#/components/schemas/Base64Url" }
            clientDataJson: { $ref: "#/components/schemas/Base64Url" }
            authenticatorData: { $ref: "#/components/schemas/Base64Url" }
            signature: { $ref: "#/components/schemas/Base64Url" }
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          items: { type: string, example: 7K2M-9QXD-4HPT-WZ3C }
    Id:
      type: string
      pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"
      description: 128 random bits as 26 lowercase Crockford Base32 characters.
    Base64Url:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
    KdfParams:
      type: object
      required: [memoryKib, iterations, parallelism]
      properties:
        memoryKib: { type: integer, minimum: 65536 }
        iterations: { type: integer, minimum: 3 }
        parallelism: { type: integer, minimum: 1 }
    ServerMeta:
      type: object
      required: [name, version, apiVersion, minKdfParams]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        minKdfParams: { $ref: "#/components/schemas/KdfParams" }
        instanceName: { type: string }
        registration: { type: string, enum: [open, invite_only, domains] }
        allowedDomains: { type: array, items: { type: string }, description: Only in `domains` mode. }
        supportUrl: { type: [string, "null"] }
        defaultLocale: { type: string, enum: [en, de] }
        passwordPolicy: { $ref: "#/components/schemas/PasswordPolicy" }
    PasswordPolicy:
      type: object
      description: Minimum for new master passwords; clients enforce it.
      required: [minScore, minLength]
      properties:
        minScore: { type: integer, enum: [3, 4] }
        minLength: { type: integer, minimum: 12, maximum: 128 }
    AccountPreferences:
      type: object
      required: [locale, notifyNewDevice]
      properties:
        locale: { type: [string, "null"], enum: [en, de, null] }
        notifyNewDevice: { type: boolean }
    InstanceSettings:
      type: object
      required: [instanceName, registration, allowedDomains, supportUrl, defaultLocale, passwordPolicy]
      properties:
        instanceName: { type: string, minLength: 1, maxLength: 60 }
        registration: { type: string, enum: [open, invite_only, domains] }
        allowedDomains: { type: array, items: { type: string } }
        supportUrl: { type: string, description: "https://, http:// or mailto: address, or empty." }
        defaultLocale: { type: string, enum: [en, de] }
        passwordPolicy: { $ref: "#/components/schemas/PasswordPolicy" }
    AdminSettings:
      type: object
      required: [settings, mail, envAdminEmails]
      properties:
        settings: { $ref: "#/components/schemas/InstanceSettings" }
        envAdminEmails: { type: array, items: { type: string } }
        mail:
          type: object
          required: [configured, transport, host, from, publicUrl, pending, failed, lastSentAt, lastError]
          properties:
            configured: { type: boolean }
            transport: { type: string, enum: [smtps, starttls, smtp, log] }
            host: { type: [string, "null"] }
            from: { type: string }
            publicUrl: { type: [string, "null"] }
            pending: { type: integer }
            failed: { type: integer }
            lastSentAt: { type: [integer, "null"] }
            lastError: { type: [string, "null"] }
    AdminUser:
      type: object
      required:
        [id, email, createdAt, lastActivityAt, status, disabledAt, instanceAdmin, activeSessions, twoFactorEnabled]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { type: string }
        createdAt: { type: integer }
        lastActivityAt: { type: [integer, "null"] }
        status: { type: string, enum: [active, disabled] }
        disabledAt: { type: [integer, "null"] }
        instanceAdmin: { type: boolean }
        activeSessions: { type: integer }
        twoFactorEnabled: { type: [boolean, "null"], description: "`null` until the server supports login 2FA." }
    Invite:
      type: object
      required: [id, email, invitedBy, createdAt, expiresAt, usedAt, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { type: string }
        invitedBy: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        usedAt: { type: [integer, "null"] }
        status: { type: string, enum: [pending, used, expired] }
    AdminEvent:
      type: object
      required: [seq, id, actorId, actorEmail, action, target, details, ip, createdAt, prevHash, hash]
      properties:
        seq: { type: integer }
        id: { $ref: "#/components/schemas/Id" }
        actorId: { type: string }
        actorEmail: { type: string }
        action:
          type: string
          description: instance_admin_bootstrap, settings_updated, user_disabled, user_enabled, test_mail_sent, invite_created, invite_used, invite_revoked
        target: { type: string }
        details: { type: [object, "null"] }
        ip: { type: string }
        createdAt: { type: integer }
        prevHash: { type: string }
        hash: { type: string }
    NewVault:
      type: object
      required: [id, encryptedKey, encryptedMeta]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        encryptedKey: { $ref: "#/components/schemas/Base64Url" }
        encryptedMeta: { $ref: "#/components/schemas/Base64Url" }
    SyncVault:
      type: object
      required: [id, encryptedKey, encryptedMeta, revision, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        encryptedKey: { $ref: "#/components/schemas/Base64Url" }
        encryptedMeta: { $ref: "#/components/schemas/Base64Url" }
        revision: { type: integer }
        updatedAt: { type: integer }
    SyncItem:
      type: object
      required: [id, vaultId, revision, encryptedData, deleted, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        vaultId: { $ref: "#/components/schemas/Id" }
        revision: { type: integer }
        encryptedData:
          oneOf:
            - { $ref: "#/components/schemas/Base64Url" }
            - { type: "null" }
        deleted: { type: boolean }
        updatedAt: { type: integer }
    WriteResponse:
      type: object
      required: [revision, seq]
      properties:
        revision: { type: integer }
        seq: { type: integer }
